packages:
  - packages/*

allowBuilds:
  # The ast_grep/ast_edit tools run the packaged @ast-grep/cli native engine; its
  # postinstall hard-links the matching platform optional package's binary into
  # the package root (the sole reason the dependency exists).
  '@ast-grep/cli': true
  # Pulled in by @deepseek-ai/dsh-subprocess-local (a dev/test dependency of the
  # integration suite). The persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # The subprocess-local worker restores the executable bit on its spawn helper.
  '@deepseek-ai/dsh-subprocess-local': true
  # Build tooling for the package itself (type-stripped build uses esbuild)
  # and the FFI layer pulled in by the platform runner chain.
  esbuild: true
  koffi: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-fs-local@0.1.0-rc.8'
  - '@deepseek-ai/dsh-fs-observation-policy@0.1.0-rc.8'
  - '@deepseek-ai/dsh-fs-sandbox@0.1.0-rc.8'
  - '@deepseek-ai/dsh-fs@0.1.0-rc.8'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.8'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.8'
  - '@deepseek-ai/dsh-sandbox-policy@0.1.0-rc.8'
  - '@deepseek-ai/dsh-sandbox@0.1.0-rc.8'
  - '@deepseek-ai/dsh-subprocess-local@0.1.0-rc.8'
  - '@deepseek-ai/dsh-subprocess@0.1.0-rc.8'
  - '@deepseek-ai/dsh-system-prompt@0.1.0-rc.8'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.8'
  - '@deepseek-ai/dsh-tools@0.1.0-rc.8'
